server:
  port: 8080

spring:
  application:
    name: lifedesk-backend
  datasource:
    url: jdbc:h2:mem:lifedeskdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

lifedesk:
  jwt:
    secret: 9a6f8b1c4e7d2a5f8b1c4e7d2a5f8b1c4e7d2a5f8b1c4e7d2a5f8b1c4e7d2a5f
    expiration-ms: 86400000
  storage:
    local-dir: ./uploads
